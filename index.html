<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>觀霧林業的古往今來｜離線導覽</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2d5a27">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="觀霧導覽">
  <style>
    :root { --forest-green: #2d5a27; --wood-brown: #8b5a2b; --bg-color: #f4f1ea; --highlight: #e8f0e6; }
    body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: var(--bg-color); color: #333; margin: 0; padding: 15px; line-height: 1.7; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { color: var(--forest-green); font-size: 22px; border-bottom: 2px solid var(--wood-brown); padding-bottom: 8px; display: inline-block; }
    
    /* 卡片與手風琴收合設計 */
    .card { background: #fff; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid var(--forest-green); overflow: hidden; }
    .card-header { padding: 18px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #fff; transition: background 0.2s; }
    .card-header:active { background: #f9f9f9; }
    .card-header h2 { margin: 0; color: var(--wood-brown); font-size: 18px; }
    .toggle-icon { font-size: 14px; color: #888; transition: transform 0.3s ease; }
    
    /* 展開時的狀態 */
    .card.active .toggle-icon { transform: rotate(180deg); }
    .card.active .card-body { display: block; }
    
    /* 內容區預設隱藏 */
    .card-body { display: none; padding: 0 20px 20px 20px; border-top: 1px solid #eee; }
    
    /* 主語音播放器（置頂） */
    .main-audio { width: 100%; margin: 15px 0; border-radius: 30px; }

    /* 站點認路照片 */
    .station-img { 
      width: 100%; 
      border-radius: 8px; 
      margin: 15px 0; 
      object-fit: cover; 
      border: 1px solid #eee;
    }
    
    /* 職人故事區塊 */
    .story-item { background: #fdfdfd; border: 1px dashed #ccc; padding: 12px 15px; border-radius: 8px; margin-bottom: 15px; }
    .story-item p { margin: 8px 0 10px 0; font-size: 14px; }
    .story-audio { width: 100%; height: 40px; }
    
    /* 其他細節樣式 */
    .meta-info { font-size: 13px; color: #555; background: #eee; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 15px; }
    .question-box { background: var(--highlight); color: var(--forest-green); padding: 12px 15px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; border-left: 4px solid var(--forest-green); }
    .section-title { font-weight: bold; color: var(--wood-brown); margin: 15px 0 5px 0; font-size: 16px; }
    
    /* 問卷區塊與實心按鈕 */
    .survey-box { background: var(--highlight); border-radius: 12px; padding: 14px 16px; margin: 20px 0 15px 0; text-align: center; }
    .survey-title { font-weight: bold; color: var(--forest-green); font-size: 16px; margin-bottom: 6px; }
    .survey-box p { font-size: 14px; margin: 0 0 12px 0; text-align: left; }
    .survey-note { font-size: 12px; color: #555; margin-top: 10px; }

    details { background: #fafafa; border: 1px solid #ddd; border-radius: 8px; margin-top: 10px; padding: 10px; }
    summary { font-weight: bold; color: var(--wood-brown); cursor: pointer; outline: none; }
    .details-content { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ccc; font-size: 14px; color: #555; }

    /* 安裝與離線下載面板 */
    .install-panel { background: #fff; border: 2px solid var(--wood-brown); border-radius: 12px; padding: 16px; margin-top: 15px; text-align: left; }
    .install-title { font-weight: bold; color: var(--wood-brown); font-size: 17px; margin-bottom: 4px; }
    .install-desc { font-size: 14px; color: #555; margin: 0 0 12px 0; }
    .install-step { margin-top: 12px; }
    .step-label { font-weight: bold; color: var(--forest-green); font-size: 15px; margin-bottom: 6px; }
    .cache-text { font-size: 14px; color: #555; margin-bottom: 6px; }
    .progress { height: 10px; background: #e5e1d8; border-radius: 5px; overflow: hidden; }
    .progress-bar { height: 100%; width: 0; background: var(--forest-green); transition: width 0.3s ease; }
    /* 輕巧空心按鈕（安裝、問卷、說明視窗共用） */
    .install-btn, .survey-btn { display: inline-block; width: auto; padding: 8px 22px; font-family: inherit; font-size: 15px; font-weight: 500; line-height: 1.4; border-radius: 999px; border: 1.5px solid currentColor; background: transparent; color: var(--forest-green); text-decoration: none; cursor: pointer; }
    .install-btn:active, .survey-btn:active { background: rgba(45, 90, 39, 0.08); }
    .install-btn[hidden] { display: none; }
    .install-note { font-size: 14px; color: #555; margin-top: 8px; }
    .install-done { color: var(--forest-green); font-weight: bold; }
    .install-error { color: #b03a2e; font-weight: bold; }
    /* 「不想安裝？」說明：灰色小字＋小箭頭，無外框 */
    .install-faq { margin-top: 12px; background: none; border: 0; padding: 0; }
    .install-faq summary { font-size: 13px; font-weight: normal; color: #888; list-style: none; }
    .install-faq summary::-webkit-details-marker { display: none; }
    .install-faq summary::before { content: "▸"; display: inline-block; margin-right: 4px; transition: transform 0.2s; }
    .install-faq[open] summary::before { transform: rotate(90deg); }
    .install-faq .details-content { margin-top: 6px; padding-top: 0; border-top: 0; font-size: 13px; line-height: 1.8; }

    /* 刪除離線資料（頁面最下方，低調處理） */
    .cleanup-box { text-align: center; font-size: 13px; color: #777; margin: 30px 0 20px 0; padding-top: 16px; border-top: 1px solid #ddd; }
    .cleanup-box p { margin: 0 0 8px 0; }
    .cleanup-btn { font-family: inherit; font-size: 13px; color: #777; background: transparent; border: 1px solid #bbb; border-radius: 999px; padding: 6px 16px; cursor: pointer; }
    .cleanup-btn:active { background: rgba(0, 0, 0, 0.05); }
    .cleanup-note { margin-top: 8px; }
    .status-line { text-align: center; font-size: 14px; color: var(--forest-green); background: var(--highlight); border-radius: 8px; padding: 8px; margin-top: 15px; }
    .status-line[hidden], .install-panel[hidden] { display: none; }

    /* 安裝步驟說明視窗 */
    .guide-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
    .guide-overlay[hidden] { display: none; }
    .guide-box { background: #fff; border-radius: 12px; padding: 20px; max-width: 400px; width: 100%; text-align: left; }
    .guide-box h3 { margin: 0 0 10px 0; color: var(--forest-green); font-size: 18px; }
    .guide-box ol { padding-left: 22px; margin: 0 0 16px 0; font-size: 15px; }
    .guide-box p { font-size: 14px; color: #555; }
  </style>
</head>
<body>

  <header style="text-align: center; margin-bottom: 15px;">
    <!-- 使用 poster.webp 作為主視覺海報 -->
    <img src="./images/poster.webp" alt="觀霧林業的古往今來" style="width: 100%; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); display: block;">
    
    <!-- 安裝與離線下載面板：已安裝且下載完成時，改顯示一行狀態 -->
    <section id="install-panel" class="install-panel">
      <div class="install-title">📲 出發前，先把導覽存進手機</div>
      <p class="install-desc">山裡的收訊不穩定，站點① 附近可能完全沒有訊號。點「安裝到手機桌面」，約 3 分鐘後主畫面會出現圖示，之後沒有網路也能聽。</p>
      <button id="install-btn" class="install-btn" type="button">安裝到手機桌面</button>
      <div id="install-text" class="install-note"></div>
      <div class="install-step">
        <div class="step-label">離線內容</div>
        <div id="cache-text" class="cache-text">準備中…</div>
        <div class="progress"><div id="cache-bar" class="progress-bar"></div></div>
      </div>
      <details class="install-faq">
        <summary>不想安裝？佔空間嗎？怎麼移除？</summary>
        <div class="details-content">
          <strong>不安裝也可以：</strong>直接使用網頁版，開啟後語音和圖片會自動下載到手機。請在有訊號的地方先開啟，等上方進度完成再出發。<br>
          <strong>佔多少空間：</strong>約 30MB，大約是 10 張手機照片。<br>
          <strong>怎麼移除：</strong><br>
          ・已安裝：長按主畫面「觀霧導覽」圖示，選「移除」或「刪除 App」。<br>
          ・網頁版：點本頁最下方的「刪除離線資料」。
        </div>
      </details>
    </section>
    <div id="status-line" class="status-line" hidden>✅ 已安裝，斷網也能使用</div>
  </header>

  <!-- 安裝步驟說明（手機沒有跳出安裝提示時使用） -->
  <div id="install-guide" class="guide-overlay" hidden>
    <div class="guide-box">
      <div id="guide-content"></div>
      <button id="guide-close" class="install-btn" type="button">我知道了</button>
    </div>
  </div>

  <div id="app-container"></div>

  <!-- 刪除離線資料（頁面最下方） -->
  <section class="cleanup-box">
    <p>不再需要導覽時，可以刪除存在手機裡的離線資料（約 30MB）。</p>
    <button id="cleanup-btn" class="cleanup-btn" type="button">刪除離線資料</button>
    <div id="cleanup-text" class="cleanup-note"></div>
  </section>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
